
// Top-level build file

buildscript {
    repositories {
        google()
        jcenter()
        mavenCentral()
        maven { url 'https://repo.grails.org/grails/core/' }
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:4.1.1'
    }
}

allprojects {
    repositories {
        google()
        jcenter()
        mavenCentral()
        maven { url 'https://repo.grails.org/grails/core/' }
        maven { url 'https://jitpack.io' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
